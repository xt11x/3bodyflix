<script>
// Diagnostics for the TV: shows script errors on screen (old engines may reject newer syntax)
window.onerror = function (m, s, l) { document.getElementById('dbg').textContent = 'v6 ERROR: ' + m + ' @' + l; };

<script>
var CINEMETA = 'https://v3-cinemeta.strem.io';
function $(id) { return document.getElementById(id); }
var main = $('main'), top_ = $('top'), video = $('video'), dbg = $('dbg'), subEl = $('sub'), osd = $('osd'), closeBtn = $('closeBtn');
var cur = null, stack = [], view = 0;
if (MOBILE) video.controls = true; // phones: native seek/fullscreen controls

// ---------- helpers ----------
// tabIndex makes items reachable by the browser's own remote navigation too (VIDAA may not pass arrows to the page)
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; if (isF(e)) e.tabIndex = 0; return e; }
function isF(e) { return e && typeof e.className === 'string' && /(^| )f( |$)/.test(e.className); }
function isHttp(u) { return typeof u === 'string' && /^https?:\/\//.test(u); }
var DEFAULT_ADDONS = ['https://3body-self.vercel.app/manifest.json'];
function addons() { try { return JSON.parse(localStorage.addons) || DEFAULT_ADDONS.slice(); } catch (e) { return DEFAULT_ADDONS.slice(); } }
function saveAddons(a) { localStorage.addons = JSON.stringify(a); }
function base(url) { return url.replace(/\/manifest\.json$/, '').replace(/\/$/, ''); }
// Browsers can only play http(s) streams; torrent (infoHash) streams need the Stremio server.
// Hindi-dubbed / dual-audio releases usually default to Hindi audio, so they are dropped (user wants English audio).
function hints(s) { return s.behaviorHints || {}; }
function fileName(s) { var u = s.url; try { u = decodeURIComponent(u); } catch (e) {} return (hints(s).filename || '') + ' ' + u.split('?')[0]; }
function isHindi(s) { return /hindi|\bhin\b|org\.hind|dual[ .-]?audio/i.test([s.name, s.title, s.description, fileName(s)].join(' ')); }
function playable(streams) { return (streams || []).filter(function (s) { return s && isHttp(s.url) && !isHindi(s); }); }
function fmtOf(s) {
  var f = (hints(s).filename || s.url.split('?')[0]).toLowerCase();
  return /\.m3u8$/.test(f) ? 'HLS' : /\.(mp4|m4v)$/.test(f) ? 'MP4' : /\.mkv$/.test(f) ? 'MKV' : /\.webm$/.test(f) ? 'WEBM' : 'FILE';
}
function isHevc(s) { return /x265|hevc|h\.?265|10.?bit/i.test(fileName(s) + ' ' + (s.title || '')); }
// TV browsers reliably play MP4/HLS (H.264). Ranked last: streams the addon flags notWebReady (Stremio needs its
// transcoding server for those), HEVC/10-bit, MKV, and streams needing custom headers a browser cannot send.
function streamRank(s) {
  var f = fmtOf(s), h = hints(s);
  return (h.proxyHeaders ? 8 : 0) + (h.notWebReady ? 4 : 0) + (isHevc(s) ? 2 : 0) + (f === 'MP4' || f === 'HLS' ? 0 : f === 'FILE' ? 1 : 2);
}
console.assert(base('https://a.b/x/manifest.json') === 'https://a.b/x', 'base');
console.assert(playable([{ url: 'https://v.mp4' }, { infoHash: 'abc' }, { url: 'magnet:x' }, { url: 'https://x/Film.Hindi.English.mkv' }]).length === 1, 'playable');
console.assert(streamRank({ url: 'https://a/b.mp4?x=1' }) < streamRank({ url: 'https://a/b.mkv' }) && streamRank({ url: 'https://a/b.mkv' }) < streamRank({ url: 'https://a/b.mp4', behaviorHints: { proxyHeaders: {} } }), 'streamRank');
console.assert(streamRank({ url: 'https://a/x', behaviorHints: { filename: 'F.x264.mp4' } }) < streamRank({ url: 'https://a/y', behaviorHints: { notWebReady: true } }) && isHindi({ url: 'https://p/api/file/1', behaviorHints: { filename: 'M.HEVC.Hindi.English.mkv' } }), 'rank/hindi via filename');

// XHR, not fetch: safest on old TV engines. Drops responses for a view the user already left.
function get(url, cb) {
  var v = view, x = new XMLHttpRequest();
  x.open('GET', url);
  x.timeout = 60000; // 3body scrapes live and often needs ~20s
  x.onload = function () { if (v !== view) return; var r = null; try { r = JSON.parse(x.responseText); } catch (e) {} cb(r); };
  x.onerror = x.ontimeout = function () { if (v === view) cb(null); };
  x.send();
}
function clear(title) { view++; main.innerHTML = ''; main.scrollTop = 0; if (MOBILE) window.scrollTo(0, 0); if (title) main.appendChild(el('h1', '', title)); }
function msg(t) { main.appendChild(el('p', 'muted', t)); }
function item(parent, text, ok) { var i = el('div', 'item f', text); i.onok = ok; parent.appendChild(i); return i; }

// ---------- remote-control navigation (spatial: nearest focusable in the arrow direction) ----------
function focusables() { return [].slice.call(document.querySelectorAll('.f')).filter(function (e) { return e.offsetParent !== null && e.parentNode !== osd && e !== closeBtn; }); }
function mark(e) { if (cur) cur.className = cur.className.replace(/ on\b/g, ''); cur = e; e.className += ' on'; }
function setFocus(e) {
  if (!e) return;
  mark(e);
  if (MOBILE) return; // no focus ring jumping / keyboard popping on touch screens
  try { e.focus(); } catch (x) {}
  e.scrollIntoView({ block: 'center' });
  var p = e.parentNode;
  if (p && /(^| )strip( |$)/.test(p.className)) p.scrollLeft = Math.max(0, e.offsetLeft - 20);
}
// Browser moved focus itself (native remote navigation) -> follow it
document.addEventListener('focus', function (ev) { if (isF(ev.target) && ev.target !== cur) mark(ev.target); }, true);
// Touch, pointer/cursor mode, or OK turned into a click by the browser
document.addEventListener('click', function (ev) {
  var t = ev.target;
  while (t && !isF(t)) t = t.parentNode;
  if (t && t.onok && t.tagName !== 'INPUT') { mark(t); t.onok(ev); }
});
function move(dx, dy) {
  if (!cur || !cur.offsetParent) return setFocus(focusables()[0]);
  var a = cur.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2, best = null, bd = 1e9;
  focusables().forEach(function (e) {
    if (e === cur) return;
    var b = e.getBoundingClientRect(), ddx = b.left + b.width / 2 - ax, ddy = b.top + b.height / 2 - ay;
    if (dx && ddx * dx <= 0) return;
    if (dy && ddy * dy <= 0) return;
    var d = dx ? Math.abs(ddx) + Math.abs(ddy) * 3 : Math.abs(ddy) + Math.abs(ddx) * 3;
    if (d < bd) { bd = d; best = e; }
  });
  setFocus(best);
}

// ---------- views ----------
// Each screen is a history entry, so the browser's own Back (which VIDAA may keep for itself) goes back inside the app
function show(fn) { if (stack.length) history.pushState(null, ''); stack.push(fn); fn(); }
function back() {
  if (video.style.display === 'block') return closePlayer();
  if (stack.length > 1) { stack.pop(); stack[stack.length - 1](); }
}
window.onpopstate = back;

function card(m, parent) {
  var c = el('div', 'card f'), img = el('img');
  if (isHttp(m.poster)) img.src = m.poster;
  c.appendChild(img); c.appendChild(el('div', '', m.name));
  c.onok = function () { show(detail(m.type, m.id)); };
  parent.appendChild(c);
  return c;
}

function grid(metas) {
  if (!metas || !metas.length) return msg('Nothing found.');
  var first = null;
  metas.forEach(function (m) { var c = card(m, main); first = first || c; });
  setFocus(first);
}

var ROWS = [
  ['Popular Movies', 'movie', 'top'],
  ['Popular Series', 'series', 'top'],
  ['Top Rated Movies', 'movie', 'imdbRating'],
  ['Top Rated Series', 'series', 'imdbRating'],
  ['Action', 'movie', 'top/genre=Action'],
  ['Comedy', 'movie', 'top/genre=Comedy'],
  ['Animation', 'movie', 'top/genre=Animation'],
  ['Crime Series', 'series', 'top/genre=Crime'],
  ['Drama Series', 'series', 'top/genre=Drama']
];
function home() {
  clear();
  ROWS.forEach(function (r, i) {
    var row = el('div', 'row'), strip = el('div', 'strip');
    row.appendChild(el('h2', '', r[0])); row.appendChild(strip); main.appendChild(row);
    get(CINEMETA + '/catalog/' + r[1] + '/' + r[2] + '.json', function (res) {
      var metas = ((res && res.metas) || []).slice(0, 20);
      if (!metas.length) return main.removeChild(row); // drop rows the catalog does not offer
      metas.forEach(function (m) { card(m, strip); });
      if (i === 0 && !(cur && main.contains(cur))) setFocus(strip.firstChild);
    });
  });
}

function catalog(type) {
  return function () {
    clear(type === 'movie' ? 'Movies' : 'Series');
    get(CINEMETA + '/catalog/' + type + '/top.json', function (r) { r ? grid(r.metas) : msg('Could not load catalog. Check internet.'); });
  };
}

function search(q) {
  return function () {
    clear('Search: ' + q);
    var n = 0, all = [];
    ['movie', 'series'].forEach(function (t) {
      get(CINEMETA + '/catalog/' + t + '/top/search=' + encodeURIComponent(q) + '.json', function (r) {
        all = all.concat((r && r.metas) || []);
        if (++n === 2) grid(all);
      });
    });
  };
}

function detail(type, id) {
  return function () {
    clear();
    get(CINEMETA + '/meta/' + type + '/' + id + '.json', function (r) {
      var m = r && r.meta;
      if (!m) return msg('Could not load details.');
      var hero = el('div'), inner = el('div', 'in');
      hero.id = 'hero';
      if (isHttp(m.background)) hero.style.backgroundImage = 'url(' + JSON.stringify(m.background) + ')';
      hero.appendChild(el('div', 'shade')); hero.appendChild(inner); main.appendChild(hero);
      inner.appendChild(el('h1', '', m.name));
      var bits = [m.releaseInfo, m.runtime, (m.genres || []).slice(0, 3).join(', '), m.imdbRating ? '★ IMDb ' + m.imdbRating : ''].filter(function (b) { return b; });
      inner.appendChild(el('div', 'meta', bits.join('   •   ')));
      inner.appendChild(el('p', '', m.description || ''));
      if (type === 'movie') {
        var b = el('div', 'btn f', '▶  Play');
        b.onok = function () { show(streams('movie', m.id, m.name)); };
        inner.appendChild(b);
        return setFocus(b);
      }
      var eps = (m.videos || []).slice().sort(function (a, b) { return (a.season - b.season) || (a.episode - b.episode); });
      var seasons = [];
      eps.forEach(function (v) { if (seasons.indexOf(v.season) < 0) seasons.push(v.season); });
      seasons.sort(function (a, b) { return (a === 0) - (b === 0) || a - b; }); // specials last
      var chipsBox = el('div'), epBox = el('div');
      inner.appendChild(chipsBox); main.appendChild(epBox);
      function pick(sn, chip) {
        [].forEach.call(chipsBox.childNodes, function (c) { c.className = c.className.replace(/ sel\b/g, ''); });
        chip.className += ' sel';
        epBox.innerHTML = '';
        eps.forEach(function (v) {
          if (v.season !== sn) return;
          item(epBox, 'E' + v.episode + '   ' + (v.name || v.title || ''), function () {
            show(streams('series', v.id, m.name + ' · S' + v.season + ' E' + v.episode));
          });
        });
      }
      seasons.forEach(function (sn) {
        var c = el('div', 'chip f', sn === 0 ? 'Specials' : 'Season ' + sn);
        c.onok = function () { pick(sn, c); setFocus(epBox.firstChild); };
        chipsBox.appendChild(c);
      });
      if (!seasons.length) return msg('No episodes listed.');
      pick(seasons[0], chipsBox.firstChild);
      setFocus(chipsBox.firstChild);
    });
  };
}

function streams(type, id, title) {
  return function () {
    clear(title || 'Streams');
    var list = addons(), n = 0, hidden = 0, queue = [];
    if (!list.length) return msg('No addons yet. Open Settings and add a stream addon URL.');
    var status = el('p', 'muted', 'Searching ' + list.length + ' addon(s)... (can take ~20 seconds)'), box = el('div');
    main.appendChild(status); main.appendChild(box);
    loadSubs(type, id);
    list.forEach(function (a) {
      get(base(a) + '/stream/' + type + '/' + id + '.json', function (r) {
        if (!r) main.appendChild(el('p', 'muted', 'Addon did not answer: ' + base(a)));
        var all = (r && r.streams) || [], ok = playable(all);
        hidden += all.length - ok.length;
        queue = queue.concat(ok);
        // stable sort: best format first, addon order kept within a rank
        queue = queue.map(function (s, i) { return [s, i]; }).sort(function (x, y) { return streamRank(x[0]) - streamRank(y[0]) || x[1] - y[1]; }).map(function (p) { return p[0]; });
        box.innerHTML = '';
        queue.forEach(function (s, i) {
          var rk = streamRank(s), it = el('div', 'item f'), tag = el('span', 'tag ' + (rk === 0 ? 'good' : rk >= 2 ? 'bad' : ''), fmtOf(s) + (isHevc(s) ? ' HEVC' : '') + (hints(s).notWebReady ? ' ⚠' : ''));
          it.appendChild(tag);
          it.appendChild(document.createTextNode(((s.name || '') + '  ' + (s.title || s.description || '')).replace(/\s+/g, ' ')));
          it.onok = function () { playQueue(queue, i, title); };
          box.appendChild(it);
        });
        if (queue.length) setFocus(box.firstChild);
        if (++n === list.length) status.textContent = queue.length + ' stream(s). Green = best chance on TV/phone, ⚠ = addon says browsers usually cannot play it. If one fails the next one starts automatically.' + (hidden ? ' ' + hidden + ' hidden (torrent or Hindi audio).' : '');
      });
    });
  };
}

// Dev: the owner's own links, edited from dev.html and saved to dev.json in the repo
function devList() {
  clear('Dev');
  get('dev.json?t=' + new Date().getTime(), function (r) {
    var items = (r || []).filter(function (d) { return d && d.name && isHttp(d.url); });
    if (!items.length) return msg('No links yet. Add them from the dev page.');
    var first = null;
    items.forEach(function (d) {
      var c = card({ name: d.name, poster: d.image }, main);
      c.onok = function () { subs = []; pq = null; play(d.url, d.name); };
      first = first || c;
    });
    setFocus(first);
  });
}

function settings() {
  clear('Settings — Addons');
  main.appendChild(el('p', 'muted', 'Paste a Stremio addon manifest URL (…/manifest.json). It must return direct http(s) streams.'));
  var inp = el('input', 'f'); inp.placeholder = 'https://…/manifest.json';
  var add = el('button', 'f', 'Add');
  inp.onok = add.onok = function () {
    var u = inp.value.trim();
    if (!isHttp(u)) return alert('URL must start with http:// or https://');
    var a = addons(); if (a.indexOf(u) < 0) a.push(u); saveAddons(a); settings();
  };
  main.appendChild(inp); main.appendChild(add);
  addons().forEach(function (u, idx) {
    item(main, '✕  ' + u, function () { var a = addons(); a.splice(idx, 1); saveAddons(a); settings(); });
  });
  setFocus(inp);
}

// ---------- subtitles ----------
// Drawn in our own overlay, synced to currentTime: TV video planes often ignore <track>, and old engines lack TextDecoder / Blob tracks.
var subs = [], subIdx = -1, cues = [], subTimer = null;
function subRank(s) { return /^(ara|ar|arabic)$/i.test(s.lang || '') ? 0 : /^(eng|en|english)$/i.test(s.lang || '') ? 1 : 2; }
function loadSubs(type, id) {
  subs = []; subIdx = -1;
  addons().forEach(function (a) {
    get(base(a) + '/subtitles/' + type + '/' + id + '.json', function (r) {
      ((r && r.subtitles) || []).forEach(function (s) { if (isHttp(s.url)) subs.push(s); });
      subs.sort(function (a, b) { return subRank(a) - subRank(b); }); // Arabic, English, rest
      if (video.style.display === 'block' && subIdx < 0 && subs.length) setSub(0); // arrived after playback started
    });
  });
}
function subNote(t) { dbg.textContent = t; dbg.style.color = '#fff'; dbg.style.fontSize = MOBILE ? '13px' : '30px'; }
function secs(h, m, s, ms) { return (+h) * 3600 + (+m) * 60 + (+s) + (+('0.' + ms)); }
function parseSrt(t) {
  var out = [];
  t.replace(/^﻿/, '').replace(/\r/g, '').split(/\n\s*\n/).forEach(function (b) {
    var m = b.match(/(\d+):(\d\d):(\d\d)[,.](\d+)\s*-->\s*(\d+):(\d\d):(\d\d)[,.](\d+)/);
    if (!m) return;
    var lines = b.split('\n'), i = 0;
    while (i < lines.length && lines[i].indexOf('-->') < 0) i++;
    out.push({ s: secs(m[1], m[2], m[3], m[4]), e: secs(m[5], m[6], m[7], m[8]), t: lines.slice(i + 1).join('\n').replace(/<[^>]+>/g, '') });
  });
  return out.sort(function (a, b) { return a.s - b.s; });
}
(function () { var c = parseSrt('1\r\n00:00:01,500 --> 00:01:02,000\r\n<i>hi</i>\r\n\r\n2\r\n00:01:03,000 --> 00:01:04,000\r\nyo'); console.assert(c.length === 2 && c[0].s === 1.5 && c[0].e === 62 && c[0].t === 'hi', 'parseSrt'); })();
// UTF-8 first; if the file is not valid UTF-8 (U+FFFD appears) refetch as Windows-1256, common for Arabic SRTs
function fetchSub(url, cb, cp) {
  var x = new XMLHttpRequest();
  x.open('GET', url); x.timeout = 30000;
  if (x.overrideMimeType) x.overrideMimeType('text/plain; charset=' + (cp || 'utf-8'));
  x.onload = function () { var t = x.responseText || ''; if (!cp && t.indexOf('�') >= 0) return fetchSub(url, cb, 'windows-1256'); cb(t); };
  x.onerror = x.ontimeout = function () { cb(null); };
  x.send();
}
function showCue() {
  var t = video.currentTime, c = null;
  for (var i = 0; i < cues.length && cues[i].s <= t; i++) if (t < cues[i].e) c = cues[i];
  subEl.textContent = c ? c.t : '';
  subEl.style.display = c ? 'block' : 'none';
}
function stopSubs() { cues = []; if (subTimer) clearInterval(subTimer); subTimer = null; subEl.style.display = 'none'; }
function setSub(i) {
  stopSubs();
  subIdx = i;
  if (i < 0 || !subs[i]) return subNote(subs.length ? 'Subtitles: off (' + subs.length + ' available)' : '');
  var s = subs[i], label = (s.lang || '?') + ' ' + (i + 1) + '/' + subs.length;
  subNote('Subtitles: loading ' + label + '...');
  fetchSub(s.url, function (text) {
    if (subIdx !== i) return;
    cues = text ? parseSrt(text) : [];
    if (!cues.length) return subNote('Subtitle ' + label + ' failed, press ▲ for next');
    subTimer = setInterval(showCue, 200);
    subNote('Subtitles: ' + label + (MOBILE ? '' : '  (▲▼ to change)'));
  });
}

// ---------- player ----------
var pq = null, watchdog = null, osdTimer = null;
function fmtTime(s) {
  if (!isFinite(s)) return 'LIVE';
  s = Math.floor(s);
  var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ':' + (m < 10 ? '0' : '') : '') + m + ':' + (x < 10 ? '0' : '') + x;
}
console.assert(fmtTime(3725) === '1:02:05' && fmtTime(65) === '1:05', 'fmtTime');

function playQueue(q, i, title) { pq = { q: q, i: i, title: title }; play(q[i].url, title); }
// Unsupported formats either fire 'error' or just never start on some TVs: both move on to the next stream
function nextStream() {
  clearTimeout(watchdog);
  if (pq && pq.i + 1 < pq.q.length) {
    pq.i++;
    subNote('Format not supported here — trying stream ' + (pq.i + 1) + '/' + pq.q.length + ' (' + fmtOf(pq.q[pq.i]) + ')');
    startSrc(pq.q[pq.i].url);
  } else {
    history.back();
    alert('No stream could be played on this device. Try another quality or title.');
  }
}
function startSrc(url) {
  video.src = url;
  var p = video.play(); if (p && p['catch']) p['catch'](function () {}); // autoplay rejections are handled by the user pressing play
  clearTimeout(watchdog);
  watchdog = setTimeout(function () { if (video.readyState < 2 && video.style.display === 'block') nextStream(); }, 25000);
}
function play(url, title) {
  if (video.style.display !== 'block') history.pushState(null, '');
  video.style.display = 'block'; closeBtn.style.display = 'block';
  $('osdTitle').textContent = title || '';
  video.onerror = nextStream;
  video.onplaying = function () { clearTimeout(watchdog); };
  // Where the browser exposes audio tracks, force English
  video.onloadedmetadata = function () {
    var at = video.audioTracks, i, en = -1;
    if (!at || at.length < 2) return;
    for (i = 0; i < at.length; i++) if (/^en/i.test(at[i].language) || /english/i.test(at[i].label)) { en = i; break; }
    if (en >= 0) for (i = 0; i < at.length; i++) at[i].enabled = i === en;
  };
  startSrc(url);
  setSub(subs.length ? 0 : -1); // best match first: Arabic, then English
  osdShow();
}
function closePlayer() {
  clearTimeout(watchdog); clearTimeout(osdTimer); pq = null; subIdx = -1; stopSubs();
  video.onerror = null; video.pause(); video.removeAttribute('src'); video.load();
  video.style.display = 'none'; osd.style.display = 'none'; closeBtn.style.display = 'none';
}

// On-screen controls (TV / desktop). Phones use the native controls instead.
function osdUpdate() {
  var d = video.duration;
  $('osdFill').style.width = (isFinite(d) && d > 0 ? video.currentTime / d * 100 : 0) + '%';
  $('osdTime').textContent = fmtTime(video.currentTime) + ' / ' + fmtTime(d);
  $('osdPlay').textContent = video.paused ? '▶' : '❚❚';
}
function osdShow() {
  if (MOBILE) return;
  osd.style.display = 'block'; subEl.style.bottom = '250px'; osdUpdate();
  clearTimeout(osdTimer);
  osdTimer = setTimeout(function () { if (!video.paused) { osd.style.display = 'none'; subEl.style.bottom = ''; } }, 4000);
}
function seek(d) {
  if (isFinite(video.duration)) video.currentTime = Math.max(0, Math.min(video.duration - 1, video.currentTime + d));
  osdShow();
}
function togglePlay() { if (video.paused) video.play(); else video.pause(); osdShow(); }
video.ontimeupdate = function () { if (osd.style.display === 'block') osdUpdate(); };
video.onpause = video.onplay = osdShow;
if (!MOBILE) video.onclick = togglePlay;
$('osdRw').onok = function () { seek(-30); };
$('osdFf').onok = function () { seek(30); };
$('osdPlay').onok = togglePlay;
closeBtn.onok = function () { history.back(); };
$('osdBar').onclick = function (ev) {
  var r = this.getBoundingClientRect();
  if (isFinite(video.duration)) { video.currentTime = video.duration * Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)); osdShow(); }
};
document.addEventListener('mousemove', function () { if (video.style.display === 'block') osdShow(); });

// ---------- keys (VIDAA back key arrives as 8; 461/10009/27 cover other TVs and PC testing; 412-417 are remote media keys) ----------
var KEYS = { ArrowLeft: 37, ArrowUp: 38, ArrowRight: 39, ArrowDown: 40, Enter: 13, Backspace: 8, Escape: 27, GoBack: 461, MediaPlayPause: 179, MediaRewind: 412, MediaFastForward: 417 };
function isBack(k) { return k === 8 || k === 27 || k === 461 || k === 10009; }
document.onkeydown = function (ev) {
  var k = ev.keyCode || ev.which || KEYS[ev.key] || 0, playing = video.style.display === 'block';
  if (playing) {
    if (k === 13 || k === 32 || k === 179 || k === 10252 || k === 415 || k === 19) togglePlay();
    else if (k === 37) seek(-10); else if (k === 39) seek(10);
    else if (k === 412) seek(-30); else if (k === 417) seek(30);
    else if (k === 38) { setSub(subIdx + 1 >= subs.length ? -1 : subIdx + 1); osdShow(); }
    else if (k === 40) { setSub(subIdx <= -1 ? subs.length - 1 : subIdx - 1); osdShow(); }
    else if (k === 413 || isBack(k)) history.back();
    else return;
    return ev.preventDefault();
  }
  if (k === 37) move(-1, 0); else if (k === 39) move(1, 0);
  else if (k === 38) move(0, -1); else if (k === 40) move(0, 1);
  else if (k === 13) { if (cur && cur.onok) cur.onok(); }
  else if (isBack(k)) { if (k === 8 && document.activeElement && document.activeElement.tagName === 'INPUT') return; history.back(); }
  else return;
  ev.preventDefault();
};

// ---------- top bar ----------
function topBtn(text, ok) { var b = el('button', 'f', text); b.onok = ok; top_.appendChild(b); }
topBtn('Home', function () { show(home); });
topBtn('Movies', function () { show(catalog('movie')); });
topBtn('Series', function () { show(catalog('series')); });
topBtn('Dev', function () { show(devList); });
var q = el('input', 'f'); q.placeholder = 'Search…';
q.onok = function () { if (q.value.trim()) show(search(q.value.trim())); };
top_.appendChild(q);
topBtn('Settings', function () { show(settings); });

show(home);
</script>
