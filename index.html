/* ===== v11: typography + motion ===== */
body{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;font-size:24px;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
h1{font-weight:800;letter-spacing:-.03em}
.feat h1{font-size:88px;font-weight:900;letter-spacing:-.04em}
.hero h1{font-size:64px}
.meta{font-size:22px;color:#c8c8ce;font-weight:500}
.hero p{font-size:24px;line-height:1.55;color:#d6d6dc;max-width:820px}
.row{margin:10px 0 18px}
.row h2{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:18px 0 12px}
.sec{font-weight:700}
#top .f,#top #q{font-size:22px;font-weight:600}
#logo{font-weight:900;letter-spacing:-.04em}
.btn{font-weight:700;font-size:24px}
.chip{font-weight:600;font-size:22px}
.wc h3{font-size:21px;font-weight:600}
.wc small{font-size:17px}
.item{font-size:22px}
/* motion: transform/opacity only, cheap enough for TV chips */
.f{-webkit-transition:transform .22s ease,box-shadow .22s ease,background-color .2s,border-color .2s,color .2s;transition:transform .22s ease,box-shadow .22s ease,background-color .2s,border-color .2s,color .2s}
.wc.on,.card.on,.ch.on{-webkit-transform:scale(1.07);transform:scale(1.07);z-index:3;box-shadow:0 14px 40px rgba(0,0,0,.7)}
.wc .ph{-webkit-transition:transform .4s ease;transition:transform .4s ease}
.wc.on .ph{box-shadow:0 0 0 3px #e50914}
.btn.on,.chip.on,.item.on,#nav .f.on{-webkit-transform:scale(1.05);transform:scale(1.05)}
.item.on{background:#26262c}
@media (hover:hover){.wc:hover,.card:hover,.ch:hover{-webkit-transform:scale(1.05);transform:scale(1.05);z-index:3}.btn:hover{-webkit-transform:scale(1.04);transform:scale(1.04)}}
@-webkit-keyframes fadeUp{from{opacity:0;-webkit-transform:translateY(24px)}to{opacity:1;-webkit-transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@-webkit-keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@-webkit-keyframes zoomOut{from{-webkit-transform:scale(1.08)}to{-webkit-transform:scale(1)}}
@keyframes zoomOut{from{transform:scale(1.08)}to{transform:scale(1)}}
#main > *{-webkit-animation:fadeIn .35s ease both;animation:fadeIn .35s ease both}
.feat{-webkit-animation:fadeIn .8s ease both;animation:fadeIn .8s ease both}
.feat .in > *{-webkit-animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) both;animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) both}
.feat .in > :nth-child(2){-webkit-animation-delay:.08s;animation-delay:.08s}
.feat .in > :nth-child(3){-webkit-animation-delay:.16s;animation-delay:.16s}
.feat .in > :nth-child(4){-webkit-animation-delay:.24s;animation-delay:.24s}
.feat .in > :nth-child(n+5){-webkit-animation-delay:.32s;animation-delay:.32s}
.strip .wc,.strip .card,.strip .ch{-webkit-animation:fadeUp .5s ease both;animation:fadeUp .5s ease both}
.strip > :nth-child(2){-webkit-animation-delay:.04s;animation-delay:.04s}
.strip > :nth-child(3){-webkit-animation-delay:.08s;animation-delay:.08s}
.strip > :nth-child(4){-webkit-animation-delay:.12s;animation-delay:.12s}
.strip > :nth-child(5){-webkit-animation-delay:.16s;animation-delay:.16s}
.strip > :nth-child(n+6){-webkit-animation-delay:.2s;animation-delay:.2s}
.dots i{-webkit-transition:width .4s ease,background .4s;transition:width .4s ease,background .4s}
.strip{padding:14px 6px 18px;margin:0 -6px}
@media (prefers-reduced-motion:reduce){*{-webkit-animation:none !important;animation:none !important;-webkit-transition:none !important;transition:none !important}}
.mobile body{font-size:15px}
.mobile .feat h1{font-size:36px}
.mobile .hero h1{font-size:28px}
.mobile .meta{font-size:13px}
.mobile .hero p{font-size:14px}
.mobile .row h2{font-size:18px;margin:12px 0 6px}

.mobile .btn{font-size:15px}
.mobile .chip{font-size:13px}
.mobile .wc h3{font-size:14px}

.mobile .item{font-size:14px}
.mobile .wc.on,.mobile .card.on,.mobile .ch.on,.mobile .btn.on,.mobile .chip.on,.mobile .item.on{-webkit-transform:none;transform:none;box-shadow:none}

<script>
var CINEMETA = 'https://v3-cinemeta.strem.io';
function $(id) { return document.getElementById(id); }
var main = $('main'), top_ = $('top'), video = $('video'), dbg = $('dbg'), subEl = $('sub'), closeBtn = $('closeBtn');
var cur = null, stack = [], view = 0;

// ---------- helpers ----------
// tabIndex makes items reachable by the browser's own remote navigation too (VIDAA may not pass arrows to the page)
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; if (isF(e)) e.tabIndex = 0; return e; }

function isHttp(u) { return typeof u === 'string' && /^https?:\/\//.test(u); }
var DEFAULT_ADDONS = ['https://3body-self.vercel.app/manifest.json'];

// XHR, not fetch: safest on old TV engines. Drops responses for a view the user already left.
function get(url, cb) {

function clear(title) { view++; main.innerHTML = ''; main.scrollTop = 0; if (MOBILE) window.scrollTo(0, 0); if (title) main.appendChild(el('h1', '', title)); }

function item(parent, text, ok) { var i = el('div', 'item f', text); i.onok = ok; parent.appendChild(i); return i; }

function grid(metas) {

// Rating-sorted "all time" lists come from the 3body addon (IMDb Top 250 + acclaimed lists with IMDb ratings)

  ['Popular Movies', 'movie', 'top'],

// Full ranked "best of all time" pages, fetched page by page (the addon serves 20 or 100 per page)

    subNote('Subtitles: ' + label + (MOBILE ? '' : '  (▲▼ to change)'));
  });
}

// ---------- player ----------
var pq = null, watchdog = null, hideTimer = null, toastTimer = null, openMenu = null, subSize = 46;
var pl = $('pl');
function fmtTime(s) {
  if (!isFinite(s)) return 'LIVE';
  s = Math.floor(s);
  var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ':' + (m < 10 ? '0' : '') : '') + m + ':' + (x < 10 ? '0' : '') + x;
}
console.assert(fmtTime(3725) === '1:02:05' && fmtTime(65) === '1:05', 'fmtTime');
function isPlaying() { return pl.style.display === 'block'; }
function toast(t) {
  if (!t) return;
  var e = $('ptoast'); e.textContent = t; e.className = 'show';
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { e.className = ''; }, 2200);
}

function playQueue(q, i, title) { pq = { q: q, i: i, title: title }; play(q[i].url, title); }
// Unsupported formats either fire 'error' or just never start on some TVs: both move on to the next stream
function nextStream() {
  clearTimeout(watchdog);
  if (pq && pq.i + 1 < pq.q.length) {
    pq.i++;
    toast('Not supported here \u2014 trying source ' + (pq.i + 1) + '/' + pq.q.length);
    startSrc(pq.q[pq.i].url); renderQ();
  } else {
    history.back();
    alert('No stream could be played on this device. Try another quality or title.');
  }
}
function startSrc(url, at) {
  pl.className = 'loading';
  video.src = url;
  if (at) resumeAt = at;
  var p = video.play(); if (p && p['catch']) p['catch'](function () {}); // autoplay rejections: the user presses play
  clearTimeout(watchdog);
  watchdog = setTimeout(function () { if (video.readyState < 2 && isPlaying()) nextStream(); }, 25000);
}
function play(url, title) {
  if (!isPlaying()) history.pushState(null, '');
  video.style.display = 'block'; pl.style.display = 'block';
  $('pTitle').textContent = title || ''; $('pDur').textContent = '';
  video.onerror = nextStream;
  resumeAt = 0;
  if (nowPlaying) watched().forEach(function (x) { if (x.vid === nowPlaying.vid) resumeAt = x.t; });
  video.onloadedmetadata = function () {
    $('pDur').textContent = isFinite(video.duration) ? fmtTime(video.duration) : 'LIVE';
    if (resumeAt > 0 && isFinite(video.duration)) { video.currentTime = Math.max(0, resumeAt - 5); resumeAt = 0; }
    // Where the browser exposes audio tracks, prefer English
    var at = video.audioTracks, i, en = -1;
    if (at && at.length > 1) {
      for (i = 0; i < at.length; i++) if (/^en/i.test(at[i].language) || /english/i.test(at[i].label)) { en = i; break; }
      if (en >= 0) for (i = 0; i < at.length; i++) at[i].enabled = i === en;
    }
    renderAudio();
  };
  startSrc(url);
  setSub(subs.length ? 0 : -1); // best match first: Arabic, then English
  closeMenus(); renderQ(); renderSubs(); renderAudio(); wake();
}
function closePlayer() {
  saveProgress(); nowPlaying = null;
  clearTimeout(watchdog); clearTimeout(hideTimer); pq = null; subIdx = -1; stopSubs(); closeMenus();
  video.onerror = null; video.pause(); video.removeAttribute('src'); video.load();
  video.style.display = 'none'; pl.style.display = 'none';
  if (cur && pl.contains(cur)) { cur.className = cur.className.replace(/ on\b/g, ''); cur = null; }
}

// controls auto-hide; the remote's first key press only wakes them
function wake() {
  pl.className = pl.className.replace(/\bhid\b/g, '');
  subEl.style.bottom = MOBILE ? '110px' : '230px';
  clearTimeout(hideTimer);
  hideTimer = setTimeout(function () {
    if (video.paused || openMenu) return;
    pl.className += ' hid'; subEl.style.bottom = '';
    if (cur && pl.contains(cur)) { cur.className = cur.className.replace(/ on\b/g, ''); cur = null; }
  }, 3500);
}
function pUpdate() {
  var d = video.duration, p = isFinite(d) && d > 0 ? video.currentTime / d * 100 : 0;
  $('pfill').style.width = p + '%'; $('pknob').style.left = p + '%';
  try { if (video.buffered.length && isFinite(d)) $('pbuf').style.width = video.buffered.end(video.buffered.length - 1) / d * 100 + '%'; } catch (e) {}
  $('ptime').textContent = fmtTime(video.currentTime) + ' / ' + fmtTime(d);
}
function seek(d) {
  if (isFinite(video.duration)) { video.currentTime = Math.max(0, Math.min(video.duration - 1, video.currentTime + d)); toast((d > 0 ? '+' : '') + d + 's'); }
  wake();
}
function togglePlay() { if (video.paused) video.play(); else video.pause(); wake(); }
var PLAY_I = '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z" fill="currentColor"/></svg>', PAUSE_I = '<svg viewBox="0 0 24 24"><path d="M7 4v16M17 4v16" stroke-width="3"/></svg>';
video.onplay = function () { $('cPlay').innerHTML = PAUSE_I; wake(); };
video.onpause = function () { $('cPlay').innerHTML = PLAY_I; saveProgress(); wake(); };
video.onwaiting = function () { if (pl.className.indexOf('loading') < 0) pl.className += ' loading'; };
video.oncanplay = video.onplaying = function () { clearTimeout(watchdog); pl.className = pl.className.replace(/\bloading\b/g, ''); };
video.ontimeupdate = function () {
  pUpdate();
  var now = new Date().getTime();
  if (now - lastSave > 10000) { lastSave = now; saveProgress(); }
};
video.onprogress = pUpdate;
video.onvolumechange = function () { var w = document.getElementById('waves'); if (w) w.style.display = video.muted ? 'none' : ''; };
$('cPlay').onok = togglePlay;
$('cBack').onok = function () { seek(-10); };
$('cFwd').onok = function () { seek(10); };
$('cMute').onok = function () { video.muted = !video.muted; toast(video.muted ? 'Muted' : 'Sound on'); wake(); };
$('cFs').onok = function () {
  var d = document, e = d.documentElement;
  if (d.fullscreenElement || d.webkitFullscreenElement) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
  if (e.requestFullscreen) e.requestFullscreen(); else if (e.webkitRequestFullscreen) e.webkitRequestFullscreen(); else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
};
$('pBack').onok = function () { history.back(); };
// tap/click on the picture: show controls, or play/pause when they are already showing
pl.onclick = function (ev) {
  if (ev.target !== pl) return;
  if (openMenu) return closeMenus();
  if (/\bhid\b/.test(pl.className)) wake(); else if (!MOBILE) togglePlay(); else wake();
};
function barSeek(x) {
  var r = $('pbar').getBoundingClientRect();
  if (isFinite(video.duration)) { video.currentTime = video.duration * Math.max(0, Math.min(1, (x - r.left) / r.width)); pUpdate(); wake(); }
}
$('pbar').onclick = function (ev) { barSeek(ev.clientX); };
$('pbar').addEventListener('touchmove', function (ev) { if (ev.touches[0]) { barSeek(ev.touches[0].clientX); ev.preventDefault(); } });
document.addEventListener('mousemove', function () { if (isPlaying()) wake(); });
document.addEventListener('touchstart', function () { if (isPlaying()) wake(); });

// menus
function closeMenus() {
  openMenu = null;
  $('qMenu').className = 'pmenu'; $('sMenu').className = 'pmenu';
  $('qBtn').className = $('qBtn').className.replace(/ open\b/g, ''); $('sBtn').className = $('sBtn').className.replace(/ open\b/g, '');
}
function toggleMenu(btn, menu) {
  var was = openMenu === menu;
  closeMenus();
  if (was) return setFocus(btn);
  openMenu = menu; $(menu).className = 'pmenu open'; btn.className += ' open';
  var sel = $(menu).querySelector('.opt.sel') || $(menu).querySelector('.f');
  setFocus(sel); wake();
}
$('qBtn').onok = function () { toggleMenu($('qBtn'), 'qMenu'); };
$('sBtn').onok = function () { toggleMenu($('sBtn'), 'sMenu'); };
function opt(parent, text, sel, ok, tag) {
  var o = el('div', 'opt f' + (sel ? ' sel' : ''));
  if (tag) o.appendChild(tag);
  o.appendChild(document.createTextNode(text));
  o.onok = ok; parent.appendChild(o); return o;
}
function qualityOf(s) { var m = /(2160p|4k|1080p|720p|480p|360p)/i.exec((s.name || '') + ' ' + (s.title || '') + ' ' + fileName(s)); return m ? m[1].toUpperCase().replace('2160P', '4K') : 'Auto'; }
function renderQ() {
  var box = $('srvList'); box.innerHTML = '';
  if (!pq) { $('qLabel').textContent = 'Auto'; opt(box, 'Default source', true, closeMenus); }
  else {
    $('qLabel').textContent = qualityOf(pq.q[pq.i]);
    pq.q.forEach(function (s, j) {
      var rk = streamRank(s), tag = el('span', 'tag ' + (rk === 0 ? 'good' : rk >= 2 ? 'bad' : ''), qualityOf(s) + ' \u00b7 ' + fmtOf(s));
      opt(box, ' ' + (s.name || 'Source ' + (j + 1)).replace(/\s+/g, ' ').slice(0, 60), j === pq.i, function () {
        if (j === pq.i) return closeMenus();
        var t = video.currentTime; pq.i = j; startSrc(s.url, t); renderQ(); closeMenus(); toast('Source ' + (j + 1) + ' \u00b7 ' + qualityOf(s));
      }, tag);
    });
  }
  var sp = $('spList'); sp.innerHTML = '';
  [0.5, 0.75, 1, 1.25, 1.5, 2].forEach(function (r) {
    var b = el('span', 'sp f' + (video.playbackRate === r ? ' sel' : ''), r + 'x');
    b.onok = function () { video.playbackRate = video.defaultPlaybackRate = r; renderQ(); toast('Speed ' + r + 'x'); setFocus($('spList').childNodes[[0.5, 0.75, 1, 1.25, 1.5, 2].indexOf(r)]); };
    sp.appendChild(b);
  });
}
function renderSubs() {
  var box = $('subList'); box.innerHTML = '';
  opt(box, 'Off', subIdx < 0, function () { setSub(-1); renderSubs(); toast('Subtitles off'); });
  if (!subs.length) box.appendChild(el('div', 'pempty', 'No subtitles found'));
  subs.forEach(function (s, i) {
    opt(box, (/^(ara|ar)$/i.test(s.lang || '') ? '\u0627\u0644\u0639\u0631\u0628\u064a\u0629' : /^(eng|en)$/i.test(s.lang || '') ? 'English' : (s.lang || '?')) + '  #' + (i + 1), i === subIdx, function () { setSub(i); renderSubs(); });
  });
  var sz = $('szList'); sz.innerHTML = '';
  [['S', 34], ['M', 46], ['L', 58], ['XL', 72]].forEach(function (z) {
    var b = el('span', 'sp f' + (subSize === z[1] ? ' sel' : ''), z[0]);
    b.onok = function () { subSize = z[1]; subEl.style.fontSize = (MOBILE ? Math.round(z[1] * 0.45) : z[1]) + 'px'; renderSubs(); toast('Subtitle size ' + z[0]); };
    sz.appendChild(b);
  });
}
function renderAudio() {
  var box = $('aList'), at = video.audioTracks; box.innerHTML = '';
  if (!at || at.length < 2) return box.appendChild(el('div', 'pempty', 'No other audio tracks'));
  for (var i = 0; i < at.length; i++) (function (i) {
    opt(box, at[i].label || at[i].language || 'Track ' + (i + 1), at[i].enabled, function () { for (var j = 0; j < at.length; j++) at[j].enabled = j === i; renderAudio(); toast('Audio: ' + (at[i].label || at[i].language || i + 1)); });
  })(i);
}
// subtitle status messages show as player toasts
subNote = function (t) { if (isPlaying()) toast(t); };

// ---------- keys (VIDAA back key arrives as 8; 461/10009/27 cover other TVs and PC testing; 412-417 are remote media keys) ----------
var KEYS = { ArrowLeft: 37, ArrowUp: 38, ArrowRight: 39, ArrowDown: 40, Enter: 13, Backspace: 8, Escape: 27, GoBack: 461, MediaPlayPause: 179, MediaRewind: 412, MediaFastForward: 417 };
function isBack(k) { return k === 8 || k === 27 || k === 461 || k === 10009; }
document.onkeydown = function (ev) {
  var k = ev.keyCode || ev.which || KEYS[ev.key] || 0, playing = video.style.display === 'block';
  if (playing) {
    var arrows = k >= 37 && k <= 40, dx = k === 37 ? -1 : k === 39 ? 1 : 0, dy = k === 38 ? -1 : k === 40 ? 1 : 0;
    var asleep = /\bhid\b/.test(pl.className);
    wake();
    if (k === 412) seek(-30); else if (k === 417) seek(30);
    else if (k === 179 || k === 10252 || k === 415 || k === 19 || k === 32) togglePlay();
    else if (k === 413) history.back();
    else if (openMenu) { // inside Quality / Audio & Subtitles menus
      if (isBack(k)) { var b = openMenu === 'qMenu' ? $('qBtn') : $('sBtn'); closeMenus(); setFocus(b); }
      else if (arrows) move(dx, dy);
      else if (k === 13) { if (cur && cur.onok) cur.onok(); }
      else return;
    } else if (cur && pl.contains(cur)) { // moving between player buttons
      if (isBack(k)) { cur.className = cur.className.replace(/ on\b/g, ''); cur = null; }
      else if (arrows) move(dx, dy);
      else if (k === 13) { if (cur.onok) cur.onok(); }
      else return;
    } else { // plain watching: arrows seek, OK pauses, Up/Down reach the buttons
      if (k === 13) { if (!asleep || video.paused) togglePlay(); }
      else if (k === 37) seek(-10); else if (k === 39) seek(10);
      else if (k === 38) setFocus($('qBtn'));
      else if (k === 40) setFocus($('cPlay'));
      else if (isBack(k)) history.back();
      else return;
    }
    return ev.preventDefault();
  }
  if (k === 37) move(-1, 0); else if (k === 39) move(1, 0);
  else if (k === 38) move(0, -1); else if (k === 40) move(0, 1);
  else if (k === 13) { if (cur && cur.onok) cur.onok(); }
  else if (isBack(k)) { if (k === 8 && document.activeElement && document.activeElement.tagName === 'INPUT') return; history.back(); }
  else return;
  ev.preventDefault();
};

// ---------- top bar ----------
var nav = el('span'), topR = el('span');
nav.id = 'nav'; topR.id = 'topR';
top_.appendChild(nav); top_.appendChild(topR);
function topBtn(text, ok, parent) {
  var b = el('button', 'f', text);
  b.onok = function () {
    if (b.parentNode === nav) { [].forEach.call(nav.childNodes, function (x) { x.className = x.className.replace(/ act\b/g, ''); }); b.className += ' act'; }
    ok();
  };
  (parent || nav).appendChild(b);
  return b;
}
topBtn('Home', function () { show(home); }).className += ' act';
topBtn('Movies', function () { show(catalog('movie')); });
topBtn('Series', function () { show(catalog('series')); });
topBtn('Catalogs', function () { show(catalogs); });
topBtn('My List', function () { show(myListPage); });
topBtn('M3U Player', function () { show(m3uHome); });
var q = el('input', 'f'); q.id = 'q'; q.placeholder = 'Search movies & series…';
q.onok = function () { if (q.value.trim()) show(search(q.value.trim())); };
topR.appendChild(q);
var profBtn = el('button', 'f', '');
profBtn.onok = function () { show(profilesPage); };
topR.appendChild(profBtn);
function updateProfileBtn() { profBtn.textContent = '👤 ' + (profile || 'Profile'); }
updateProfileBtn();
topBtn('Settings', function () { show(settings); }, topR);
if (MOBILE) top_.appendChild(q); // phones: search gets its own full-width line under the buttons

// keep content just below the top bar whatever its height (it can wrap on narrow non-phone screens)
if (!MOBILE) { main.style.top = '0'; main.style.paddingTop = top_.offsetHeight + 'px'; } // header floats over the content
// Start: a shared title link (#/movie/tt...) opens that title on top of Home; first visit asks who is watching
var route = /^#\/(movie|series)\/(tt\d+)$/.exec(location.hash);
if (route) history.replaceState(null, '', location.pathname + location.search);
show(profile ? home : profilesPage);
if (route) openTitle(route[1], route[2]);
</script>
