$('pbar').addEventListener('touchmove', function (ev) { if (ev.touches[0]) { barSeek(ev.touches[0].clientX); ev.preventDefault(); } });
document.addEventListener('mousemove', function () { if (isPlaying()) wake(); });
document.addEventListener('touchstart', function () { if (isPlaying()) wake(); });

// menus
function closeMenus() {
  openMenu = null;
  $('qMenu').className = 'pmenu'; $('sMenu').className = 'pmenu';
  $('qBtn').className = $('qBtn').className.replace(/ open\b/g, ''); $('sBtn').className = $('sBtn').className.replace(/ open\b/g, '');
}
function toggleMenu(btn, menu) {
  var was = openMenu === menu;
  closeMenus();
  if (was) return setFocus(btn);
  openMenu = menu; $(menu).className = 'pmenu open'; btn.className += ' open';
  var sel = $(menu).querySelector('.opt.sel') || $(menu).querySelector('.f');
  setFocus(sel); wake();
}
$('qBtn').onok = function () { toggleMenu($('qBtn'), 'qMenu'); };
$('sBtn').onok = function () { toggleMenu($('sBtn'), 'sMenu'); };
function opt(parent, text, sel, ok, tag) {
  var o = el('div', 'opt f' + (sel ? ' sel' : ''));
  if (tag) o.appendChild(tag);
  o.appendChild(document.createTextNode(text));
  o.onok = ok; parent.appendChild(o); return o;
}
function qualityOf(s) { var m = /(2160p|4k|1080p|720p|480p|360p)/i.exec((s.name || '') + ' ' + (s.title || '') + ' ' + fileName(s)); return m ? m[1].toUpperCase().replace('2160P', '4K') : 'Auto'; }
function renderQ() {
  var box = $('srvList'); box.innerHTML = '';
  if (!pq || !pq.q.length) { $('qLabel').textContent = 'Auto'; opt(box, 'Auto', true, closeMenus); }
  else {
    var curQ = qualityOf(pq.q[pq.i]), groups = {}, order = [];
    $('qLabel').textContent = pq.auto ? 'Auto' : curQ;
    pq.q.forEach(function (s, j) { var q = qualityOf(s); if (!groups[q]) { groups[q] = []; order.push(q); } groups[q].push(j); });
    order.sort(function (a, b) { return ['4K', '1080P', '720P', '480P', '360P', 'Auto'].indexOf(a) - ['4K', '1080P', '720P', '480P', '360P', 'Auto'].indexOf(b); });
    if (MOBILE) {
      opt(box, 'Open in ' + (IS_IOS ? 'VLC' : 'VLC / MX Player'), false, function () { openExternal(); });
      if (IS_IOS) opt(box, 'Open in Infuse', false, function () { openExternal('infuse'); });
    }
    opt(box, 'Auto  (fastest)', pq.auto, function () {
      pq.auto = true; closeMenus();
      if (pq.i !== 0) { pq.i = 0; startSrc(pq.q[0].url, video.currentTime); }
      renderQ(); toast('Auto quality');
    });
    order.forEach(function (q) {
      if (q === 'Auto') return;
      opt(box, q + (q === '4K' ? '  Ultra HD' : q === '1080P' ? '  Full HD' : q === '720P' ? '  HD' : ''), !pq.auto && q === curQ, function () {
        closeMenus(); pq.auto = false;
        if (q !== curQ) { pq.i = groups[q][0]; pq.tried[pq.i] = 1; startSrc(pq.q[pq.i].url, video.currentTime); }
        renderQ(); toast(q);
      });
    });
  }
  var sp = $('spList'); sp.innerHTML = '';
  [0.5, 0.75, 1, 1.25, 1.5, 2].forEach(function (r) {
    var b = el('span', 'sp f' + (video.playbackRate === r ? ' sel' : ''), r + 'x');
    b.onok = function () { video.playbackRate = video.defaultPlaybackRate = r; renderQ(); toast('Speed ' + r + 'x'); setFocus($('spList').childNodes[[0.5, 0.75, 1, 1.25, 1.5, 2].indexOf(r)]); };
    sp.appendChild(b);
  });
}
function renderSubs() {
  var box = $('subList'); box.innerHTML = '';
  opt(box, 'Off', subIdx < 0, function () { setSub(-1); renderSubs(); toast('Subtitles off'); });
  if (!subs.length) box.appendChild(el('div', 'pempty', 'No subtitles found'));
  var curLang = subIdx >= 0 && subs[subIdx] ? langOf(subs[subIdx]) : '';
  [['ar', 'Arabic \u2014 \u0627\u0644\u0639\u0631\u0628\u064a\u0629'], ['en', 'English']].forEach(function (L) {
    var first = -1;
    for (var i = 0; i < subs.length; i++) if (langOf(subs[i]) === L[0]) { first = i; break; }
    if (first < 0) return;
    opt(box, L[1], curLang === L[0], function () { setSub(first); renderSubs(); });
  });
  var sz = $('szList'); sz.innerHTML = '';
  [['S', 34], ['M', 46], ['L', 58], ['XL', 72]].forEach(function (z) {
    var b = el('span', 'sp f' + (subSize === z[1] ? ' sel' : ''), z[0]);
    b.onok = function () { subSize = z[1]; subEl.style.fontSize = (MOBILE ? Math.round(z[1] * 0.45) : z[1]) + 'px'; renderSubs(); toast('Subtitle size ' + z[0]); };
    sz.appendChild(b);
  });
}
function renderAudio() {
  var box = $('aList'), at = video.audioTracks; box.innerHTML = '';
  if (!at || at.length < 2) return box.appendChild(el('div', 'pempty', 'No other audio tracks'));
  for (var i = 0; i < at.length; i++) (function (i) {
    opt(box, at[i].label || at[i].language || 'Track ' + (i + 1), at[i].enabled, function () { for (var j = 0; j < at.length; j++) at[j].enabled = j === i; renderAudio(); toast('Audio: ' + (at[i].label || at[i].language || i + 1)); });
  })(i);
}
// subtitle status messages show as player toasts
subNote = function (t) { if (isPlaying() && /failed/i.test(t)) toast('Subtitle unavailable'); };

// ---------- keys (VIDAA back key arrives as 8; 461/10009/27 cover other TVs and PC testing; 412-417 are remote media keys) ----------
var kbdUsed = IS_TV;
if (IS_TV) document.documentElement.className += ' kbd';
document.addEventListener('keydown', function (ev) { var k = ev.keyCode; if (!kbdUsed && k >= 37 && k <= 40) { kbdUsed = true; document.documentElement.className += ' kbd'; } }, true);
var KEYS = { ArrowLeft: 37, ArrowUp: 38, ArrowRight: 39, ArrowDown: 40, Enter: 13, Backspace: 8, Escape: 27, GoBack: 461, MediaPlayPause: 179, MediaRewind: 412, MediaFastForward: 417 };
function isBack(k) { return k === 8 || k === 27 || k === 461 || k === 10009; }
document.onkeydown = function (ev) {
  var k = ev.keyCode || ev.which || KEYS[ev.key] || 0, playing = video.style.display === 'block';
  if (playing) {
    var arrows = k >= 37 && k <= 40, dx = k === 37 ? -1 : k === 39 ? 1 : 0, dy = k === 38 ? -1 : k === 40 ? 1 : 0;
    var asleep = /\bhid\b/.test(pl.className);
    wake();
    if (k === 412) seek(-30); else if (k === 417) seek(30);
    else if (k === 179 || k === 10252 || k === 415 || k === 19 || k === 32) togglePlay();
    else if (k === 413) history.back();
    else if (openMenu) { // inside Quality / Audio & Subtitles menus
      if (isBack(k)) { var b = openMenu === 'qMenu' ? $('qBtn') : $('sBtn'); closeMenus(); setFocus(b); }
      else if (arrows) move(dx, dy);
      else if (k === 13) { if (cur && cur.onok) cur.onok(); }
      else return;
    } else if (cur && pl.contains(cur)) { // moving between player buttons
      if (isBack(k)) { cur.className = cur.className.replace(/ on\b/g, ''); cur = null; }
      else if (arrows) move(dx, dy);
      else if (k === 13) { if (cur.onok) cur.onok(); }
      else return;
    } else { // plain watching: arrows seek, OK pauses, Up/Down reach the buttons
      if (k === 13) { if (!asleep || video.paused) togglePlay(); }
      else if (k === 37) seek(-10); else if (k === 39) seek(10);
      else if (k === 38) setFocus($('qBtn'));
      else if (k === 40) setFocus($('cPlay'));
      else if (isBack(k)) history.back();
      else return;
    }
    return ev.preventDefault();
  }
  if (k === 37) move(-1, 0); else if (k === 39) move(1, 0);
  else if (k === 38) move(0, -1); else if (k === 40) move(0, 1);
  else if (k === 13) { if (cur && cur.onok) cur.onok(); }
  else if (isBack(k)) { if (k === 8 && document.activeElement && document.activeElement.tagName === 'INPUT') return; history.back(); }
  else return;
  ev.preventDefault();
};

// ---------- top bar ----------
var nav = el('span'), topR = el('span');
nav.id = 'nav'; topR.id = 'topR';
top_.appendChild(nav); top_.appendChild(topR);
var NAV_ICON = { Home: 'home', Movies: 'film', Shows: 'tv', Catalogs: 'grid', 'My List': 'star', M3U: 'list' };
function topBtn(text, ok, parent) {
  var b = el('button', 'f');
  if (NAV_ICON[text]) setIbtn(b, NAV_ICON[text], text); else b.textContent = text;
  b.onok = function () {
    if (b.parentNode === nav) { [].forEach.call(nav.childNodes, function (x) { x.className = x.className.replace(/ act\b/g, ''); }); b.className += ' act'; }
    ok();
  };
  (parent || nav).appendChild(b);
  return b;
}
topBtn('Home', function () { show(home, '/'); }).className += ' act';
topBtn('Movies', function () { show(catalog('movie'), '/movies', 'Movies'); });
topBtn('Shows', function () { show(catalog('series'), '/shows', 'Shows'); });
topBtn('Catalogs', function () { show(catalogs, '/catalogs', 'Catalogs'); });
topBtn('My List', function () { show(myListPage, '/my-list', 'My List'); });
topBtn('M3U', function () { show(m3uHome, '/m3u', 'M3U Player'); });
var q = el('input', 'f'); q.id = 'q'; q.placeholder = 'Search movies & series…';
q.onok = function () { if (q.value.trim()) show(searchPage(q.value.trim())); };
topR.appendChild(q);
nav.appendChild(el('span', 'nsep'));
var srchBtn = el('button', 'f ib'); srchBtn.innerHTML = ico('search'); srchBtn.title = 'Search';
srchBtn.onok = function () { show(searchPage(), '/search', 'Search'); };
nav.appendChild(srchBtn);
var profBtn = el('button', 'f ib');
profBtn.onok = function () { show(profilesPage, '/profiles', 'Profiles'); };
nav.appendChild(profBtn);
function updateProfileBtn() { profBtn.innerHTML = '<span class="av">' + ico('user') + '</span>'; profBtn.title = profile || 'Profile'; }
updateProfileBtn();
var setBtn = el('button', 'f ib'); setBtn.innerHTML = ico('gear'); setBtn.title = 'Settings';
setBtn.onok = function () { show(settings, '/settings', 'Settings'); };
nav.appendChild(setBtn);
if (MOBILE) top_.appendChild(q); // (hidden on phones: the tab bar has its own search page)
function tabGo(id, fn) {
  $(id).onok = function () {
    [].forEach.call($('tabbar').querySelectorAll('.tab'), function (t) { t.className = t.className.replace(/ act\b/g, ''); });
    $(id).className += ' act'; fn();
  };
}
tabGo('tHome', function () { show(home, '/'); });
tabGo('tMov', function () { show(catalog('movie'), '/movies', 'Movies'); });
tabGo('tSer', function () { show(catalog('series'), '/shows', 'Shows'); });
tabGo('tList', function () { show(myListPage, '/my-list', 'My List'); });
tabGo('tSearch', function () { show(searchPage(), '/search', 'Search'); });
tabGo('tProf', function () { show(profilesPage, '/profiles', 'Profiles'); });

// keep content just below the top bar whatever its height (it can wrap on narrow non-phone screens)
if (!MOBILE) { main.style.top = '0'; main.style.paddingTop = top_.offsetHeight + 'px'; } // header floats over the content
// Start: a shared title link (#/movie/tt...) opens that title on top of Home; first visit asks who is watching
(function () {
  var path = location.pathname.slice(BASE.length).replace(/\/+$/, '') || '/', qs = location.search, m;
  var old = /^#\/(movie|series)\/(tt\d+)$/.exec(location.hash);
  if (!profile) return show(profilesPage, '/profiles', 'Profiles');
  show(home, '/');
  if (old) return openTitle(old[1], old[2]);
  if ((m = /^\/(movie|show)\/(?:[a-z0-9-]*-)?(tt\d+)$/.exec(path))) return openTitle(m[1] === 'show' ? 'series' : 'movie', m[2]);
  var pages = { '/movies': [catalog('movie'), 'Movies'], '/shows': [catalog('series'), 'Shows'], '/catalogs': [catalogs, 'Catalogs'],
    '/my-list': [myListPage, 'My List'], '/m3u': [m3uHome, 'M3U Player'], '/profiles': [profilesPage, 'Profiles'], '/settings': [settings, 'Settings'],
    '/top/movies': [best('movie'), 'Best Movies of All Time'], '/top/shows': [best('series'), 'Best Shows of All Time'], '/top/imdb-250': [best('imdb'), 'IMDb Top 250'] };
  if (pages[path]) return show(pages[path][0], path, pages[path][1]);
  if (path === '/search') { var q = (/[?&]q=([^&]*)/.exec(qs) || [])[1]; q = q ? decodeURIComponent(q.replace(/\+/g, ' ')) : ''; return show(searchPage(q), '/search' + (q ? '?q=' + encodeURIComponent(q) : ''), q ? 'Search: ' + q : 'Search'); }
  if ((m = /^\/genre\/(movies|shows)\/([a-z-]+)$/.exec(path))) {
    var g = GENRES.filter(function (x) { return slug(x) === m[2]; })[0];
    if (g) return show(genrePage(m[1] === 'shows' ? 'series' : 'movie', g), path, g + (m[1] === 'shows' ? ' Shows' : ' Movies'));
  }
  if (path !== '/') history.replaceState(null, '', BASE + '/');
})();
