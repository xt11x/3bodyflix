body{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;font-size:24px;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}

/* motion: transform/opacity only, cheap enough for TV chips */
.f{-webkit-transition:transform .22s ease,box-shadow .22s ease,background-color .2s,border-color .2s,color .2s;transition:transform .22s ease,box-shadow .22s ease,background-color .2s,border-color .2s,color .2s}
.wc.on,.card.on,.ch.on{-webkit-transform:scale(1.07);transform:scale(1.07);z-index:3;box-shadow:0 14px 40px rgba(0,0,0,.7)}
.wc .ph{-webkit-transition:transform .4s ease;transition:transform .4s ease}
.wc.on .ph{box-shadow:0 0 0 3px #e50914}
.btn.on,.chip.on,.item.on,#nav .f.on{-webkit-transform:scale(1.05);transform:scale(1.05)}
.item.on{background:#26262c}
@media (hover:hover){.wc:hover,.card:hover,.ch:hover{-webkit-transform:scale(1.05);transform:scale(1.05);z-index:3}.btn:hover{-webkit-transform:scale(1.04);transform:scale(1.04)}}
@-webkit-keyframes fadeUp{from{opacity:0;-webkit-transform:translateY(24px)}to{opacity:1;-webkit-transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@-webkit-keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@-webkit-keyframes zoomOut{from{-webkit-transform:scale(1.08)}to{-webkit-transform:scale(1)}}
@keyframes zoomOut{from{transform:scale(1.08)}to{transform:scale(1)}}
#main > *{-webkit-animation:fadeIn .35s ease both;animation:fadeIn .35s ease both}
.feat{-webkit-animation:fadeIn .8s ease both;animation:fadeIn .8s ease both}
.feat .in > *{-webkit-animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) both;animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) both}
.feat .in > :nth-child(2){-webkit-animation-delay:.08s;animation-delay:.08s}
.feat .in > :nth-child(3){-webkit-animation-delay:.16s;animation-delay:.16s}
.feat .in > :nth-child(4){-webkit-animation-delay:.24s;animation-delay:.24s}
.feat .in > :nth-child(n+5){-webkit-animation-delay:.32s;animation-delay:.32s}
.strip .wc,.strip .card,.strip .ch{-webkit-animation:fadeUp .5s ease both;animation:fadeUp .5s ease both}
.strip > :nth-child(2){-webkit-animation-delay:.04s;animation-delay:.04s}
.strip > :nth-child(3){-webkit-animation-delay:.08s;animation-delay:.08s}
.strip > :nth-child(4){-webkit-animation-delay:.12s;animation-delay:.12s}
.strip > :nth-child(5){-webkit-animation-delay:.16s;animation-delay:.16s}
.strip > :nth-child(n+6){-webkit-animation-delay:.2s;animation-delay:.2s}
.dots i{-webkit-transition:width .4s ease,background .4s;transition:width .4s ease,background .4s}
.strip{padding:14px 6px 18px;margin:0 -6px}
@media (prefers-reduced-motion:reduce){*{-webkit-animation:none !important;animation:none !important;-webkit-transition:none !important;transition:none !important}}

.feat .bgl{-webkit-animation:kenburns 9s ease-out both;animation:kenburns 9s ease-out both;-webkit-transform-origin:70% 30%;transform-origin:70% 30%}
@-webkit-keyframes kenburns{from{-webkit-transform:scale(1.12)}to{-webkit-transform:scale(1)}}

.hero .shade,.hero .in,.hero .dots{z-index:1}
.feat.leaving{position:absolute !important;top:0;left:0;right:0;z-index:0;-webkit-animation:fadeOut .9s ease both;animation:fadeOut .9s ease both}
.feat.entering{position:relative;z-index:1;-webkit-animation:fadeIn .9s ease both;animation:fadeIn .9s ease both}
@-webkit-keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
.feat .in > *{-webkit-animation:fadeUp .8s cubic-bezier(.2,.7,.2,1) both;animation:fadeUp .8s cubic-bezier(.2,.7,.2,1) both}
.feat .in > :nth-child(1){-webkit-animation-delay:.15s;animation-delay:.15s}
.feat .in > :nth-child(2){-webkit-animation-delay:.25s;animation-delay:.25s}
.feat .in > :nth-child(3){-webkit-animation-delay:.35s;animation-delay:.35s}
.feat .in > :nth-child(4){-webkit-animation-delay:.45s;animation-delay:.45s}
.feat .in > :nth-child(n+5){-webkit-animation-delay:.55s;animation-delay:.55s}
.dots i.a{position:relative;overflow:hidden;background:#555}
.dots i.a:after{content:"";position:absolute;top:0;left:0;bottom:0;width:100%;background:#f2f2f4;-webkit-transform-origin:left;transform-origin:left;-webkit-animation:slidebar 7s linear both;animation:slidebar 7s linear both}
@-webkit-keyframes slidebar{from{-webkit-transform:scaleX(0)}to{-webkit-transform:scaleX(1)}}

function api(method, path, body, cb) {
  var x = new XMLHttpRequest();
  x.open(method, API + '/api/' + path);
